name: ECU Pro Tune - Windows CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecu-pro-tune-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    name: Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile all Python modules
        run: python -m compileall -q src tests

      - name: Run unit tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

      - name: Validate PowerShell scripts and acceptance report gate
        shell: pwsh
        run: ./tests/test_windows_acceptance_validator.ps1

      - name: Smoke test Windows installer
        shell: pwsh
        env:
          ECU_PRO_TUNE_CI: "1"
        run: |
          cmd /c install_ecu_pro_tune.bat
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Windows installer failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }
          .\.venv\Scripts\python.exe -c "import sys; assert sys.version_info[:2] == (3, 11); import numpy, matplotlib, ttkbootstrap, pydub, PIL, playsound; from src.core.sound_manager import SoundManager; from src.app.dashboard import Dashboard; print('Installed virtual environment smoke test: OK')"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Installed virtual environment smoke test failed."
            exit $LASTEXITCODE
          }

      - name: Smoke test application and dashboard imports
        env:
          MPLBACKEND: Agg
        run: |
          python -c "from src.app.main import ECUProTuneApp; from src.app.dashboard import Dashboard; from src.core.sound_manager import SoundManager; print('Application imports: OK')"

      - name: Smoke test Tk dashboard construction
        env:
          MPLBACKEND: Agg
        shell: pwsh
        run: |
          @'
          import logging
          import tkinter as tk
          import ttkbootstrap as ttk
          from src.app.dashboard import Dashboard
          from src.app.scheduler_panel import SchedulerPanel

          root = ttk.Window(themename="darkly")
          root.withdraw()
          dashboard = Dashboard(root, "performance", logging.getLogger("ci-dashboard"))
          dashboard.pack(fill="both", expand=True)
          root.update_idletasks()
          panel = SchedulerPanel(dashboard, dashboard.scheduler, logging.getLogger("ci-scheduler-panel"))
          panel.pack(fill="both", expand=True)
          root.update_idletasks()
          root.update()
          panel.destroy()
          dashboard.destroy()
          root.destroy()
          print("Tk dashboard and scheduler panel construction: OK")
          '@ | python -

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Generate Windows executable version metadata
        run: python scripts/generate_windows_version_info.py

      - name: Build Windows executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --name ECUProTune
          --version-file build/windows_version_info.txt
          --paths .
          --add-data "configs;configs"
          --add-data "maps;maps"
          --collect-all ttkbootstrap
          --collect-all matplotlib
          src/app/main.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/ECUProTune/ECUProTune.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Expected executable not found: $exe"
            exit 1
          }
          Get-Item $exe | Format-List FullName, Length, LastWriteTime

      - name: Verify Windows executable version metadata
        shell: pwsh
        run: |
          $exe = "dist/ECUProTune/ECUProTune.exe"
          $version = (Get-Content "VERSION" -Raw).Trim()
          $expectedVersion = "$version.0"
          $versionInfo = (Get-Item $exe).VersionInfo
          if ($versionInfo.FileVersion -ne $expectedVersion) {
            Write-Error "FileVersion mismatch. Expected $expectedVersion, got $($versionInfo.FileVersion)."
            exit 1
          }
          if ($versionInfo.ProductVersion -ne $expectedVersion) {
            Write-Error "ProductVersion mismatch. Expected $expectedVersion, got $($versionInfo.ProductVersion)."
            exit 1
          }
          Write-Host "Windows EXE version verified: $expectedVersion"

      - name: Smoke test packaged application startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/ECUProTune/ECUProTune.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            Write-Error "Packaged application exited during startup (exit code $($process.ExitCode))."
            exit 1
          }
          Stop-Process -Id $process.Id -Force

      - name: Package Windows release
        shell: pwsh
        run: |
          ./scripts/package_release.ps1 -SourceDirectory "dist/ECUProTune" -OutputDirectory "release"
          $manifest = Get-Content "release/BUILD-MANIFEST.json" -Raw | ConvertFrom-Json
          $archive = Join-Path "release" $manifest.archive
          if (-not (Test-Path $archive)) {
            Write-Error "Release archive not found: $archive"
            exit 1
          }
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $manifest.sha256) {
            Write-Error "Release archive SHA-256 does not match the manifest."
            exit 1
          }
          Write-Host "Release package and SHA-256 verified."

      - name: Independently verify release archive
        shell: pwsh
        run: |
          ./scripts/verify_release.ps1 -ReleaseDirectory "release"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: ECUProTune-Windows-Python311
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Write CI summary
        if: always()
        shell: pwsh
        run: |
          "## ECU Pro Tune - Windows CI" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Commit: $env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Branch/ref: $env:GITHUB_REF" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Runner: $env:RUNNER_OS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Python: 3.11" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Release artifact: versioned ZIP + BUILD-MANIFEST.json + SHA256SUMS.txt (14 days)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
